<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarTrack AI - Live Fleet Tracking Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        #map { height: calc(100vh - 64px); width: 100%; z-index: 1; }
        .vehicle-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .vehicle-moving { background-color: #10B981; border: 3px solid #34D399; }
        .vehicle-idle { background-color: #F59E0B; border: 3px solid #FBBF24; }
        .vehicle-offline { background-color: #6B7280; border: 3px solid #9CA3AF; }
        .pulse-moving { animation: pulse-green 2s infinite; }
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-screen overflow-hidden">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-800 border-b border-slate-700 h-16 px-4 flex items-center justify-between z-10 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-sky-500/20">
                <i class="fa-solid fa-truck-fast"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-none text-white tracking-wide">CarTrack AI <span class="text-xs font-normal text-sky-400 bg-sky-950/80 px-2 py-0.5 rounded-full border border-sky-500/30">Fleet Web</span></h1>
                <p class="text-xs text-slate-400">ระบบติดตามยานพาหนะเรียลไทม์ (Supabase Cloud Sync)</p>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <div id="syncStatus" class="hidden md:flex items-center space-x-2 text-xs bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                <span class="text-emerald-400 font-medium">กำลังเชื่อมต่อ Supabase สด</span>
                <span id="lastUpdated" class="text-slate-400 font-mono text-[11px] ml-1">--:--:--</span>
            </div>

            <button onclick="fetchVehiclesData()" class="bg-sky-600 hover:bg-sky-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium flex items-center space-x-1.5 transition">
                <i class="fa-solid fa-rotate"></i>
                <span>รีเฟรช</span>
            </button>

            <button onclick="toggleSettingsModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 p-2 rounded-lg text-xs transition">
                <i class="fa-solid fa-gear text-sm"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Body -->
    <div class="flex flex-1 overflow-hidden relative">

        <!-- Sidebar: Vehicle List -->
        <aside id="sidebar" class="w-full md:w-96 bg-slate-800/95 backdrop-blur border-r border-slate-700 flex flex-col z-10 transition-all duration-300">
            <!-- Search & Filter Header -->
            <div class="p-3 border-b border-slate-700 space-y-2">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
                    <input type="text" id="searchInput" oninput="filterVehicles()" placeholder="ค้นหาชื่อรถ / ทะเบียน / คนขับ..." 
                           class="w-full pl-9 pr-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-100 focus:outline-none focus:border-sky-500 placeholder-slate-500">
                </div>

                <div class="flex items-center justify-between text-xs text-slate-400 px-1">
                    <span>รถทั้งหมด: <strong id="totalVehiclesCount" class="text-sky-400">0</strong> คัน</span>
                    <div class="flex space-x-2">
                        <span class="text-emerald-400"><i class="fa-solid fa-circle text-[8px] mr-1"></i>วิ่งอยู่ <strong id="movingCount">0</strong></span>
                        <span class="text-amber-400"><i class="fa-solid fa-circle text-[8px] mr-1"></i>จอด <strong id="idleCount">0</strong></span>
                    </div>
                </div>
            </div>

            <!-- Vehicle Cards List -->
            <div id="vehicleList" class="flex-1 overflow-y-auto p-3 space-y-2.5">
                <div class="text-center py-12 text-slate-500 text-xs">
                    <i class="fa-solid fa-spinner fa-spin text-2xl text-sky-500 mb-2"></i>
                    <p>กำลังโหลดข้อมูลรถจาก Supabase...</p>
                </div>
            </div>
        </aside>

        <!-- Map Container -->
        <main class="flex-1 relative">
            <div id="map"></div>

            <!-- Floating Legend -->
            <div class="absolute bottom-6 right-6 bg-slate-800/90 border border-slate-700 p-3 rounded-xl shadow-xl z-10 backdrop-blur text-xs text-slate-300 space-y-1.5">
                <div class="font-semibold text-slate-100 mb-1">สัญลักษณ์สถานะบนแผนที่</div>
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                    <span>กำลังเคลื่อนที่ (Moving)</span>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-amber-500"></span>
                    <span>จอดพัก / IDLE</span>
                </div>
            </div>
        </main>

    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-700 pb-3">
                <h3 class="font-bold text-slate-100 text-base"><i class="fa-solid fa-gear text-sky-400 mr-2"></i>ตั้งค่าการเชื่อมต่อ Supabase</h3>
                <button onclick="toggleSettingsModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-300 mb-1 font-medium">Supabase URL</label>
                    <input type="text" id="supabaseUrlInput" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-sky-500 font-mono text-xs">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-medium">Supabase Anon Key</label>
                    <textarea id="supabaseKeyInput" rows="3" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-sky-500 font-mono text-[11px]"></textarea>
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2 border-t border-slate-700">
                <button onclick="toggleSettingsModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-medium">ยกเลิก</button>
                <button onclick="saveSettings()" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-xs font-medium">บันทึกและเชื่อมต่อ</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        let DEFAULT_SUPABASE_URL = "https://rhzglphlfzhautvwpnae.supabase.co";
        let DEFAULT_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJoemdscGhsZnpoYXV0dndwbmFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4OTQzNDUsImV4cCI6MjEwMTQ3MDM0NX0.JMx8DvXgES0x9N7YmjW2n_7mgMYm_bgAkv39xb_Q2Jo";

        let supabaseUrl = localStorage.getItem("sp_url") || DEFAULT_SUPABASE_URL;
        let supabaseKey = localStorage.getItem("sp_key") || DEFAULT_ANON_KEY;

        document.getElementById("supabaseUrlInput").value = supabaseUrl;
        document.getElementById("supabaseKeyInput").value = supabaseKey;

        // Initialize Leaflet Map centered on Thailand
        const map = L.map('map').setView([15.8700, 100.9925], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let vehicleMarkers = {};
        let vehiclesData = [];
        let selectedVehicleId = null;
        let historyPolyline = null;

        async function fetchVehiclesData() {
            try {
                const cleanedUrl = supabaseUrl.trim().replace(/\/$/, "");
                const res = await fetch(`${cleanedUrl}/rest/v1/vehicles?select=*`, {
                    headers: {
                        'apikey': supabaseKey,
                        'Authorization': `Bearer ${supabaseKey}`
                    }
                });

                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                
                vehiclesData = await res.json();
                updateUI(vehiclesData);

                document.getElementById("lastUpdated").innerText = new Date().toLocaleTimeString('th-TH');
            } catch (err) {
                console.error("Fetch vehicles error:", err);
            }
        }

        function updateUI(vehicles) {
            const listEl = document.getElementById("vehicleList");
            const searchVal = document.getElementById("searchInput").value.toLowerCase();

            const filtered = vehicles.filter(v => 
                (v.vehicle_name || '').toLowerCase().includes(searchVal) ||
                (v.license_plate || '').toLowerCase().includes(searchVal) ||
                (v.driver_name || '').toLowerCase().includes(searchVal)
            );

            document.getElementById("totalVehiclesCount").innerText = vehicles.length;
            document.getElementById("movingCount").innerText = vehicles.filter(v => (v.status || '').includes("MOVING") || (v.speed_kmh || 0) > 3).length;
            document.getElementById("idleCount").innerText = vehicles.filter(v => !(v.status || '').includes("MOVING") && (v.speed_kmh || 0) <= 3).length;

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">ไม่พบข้อมูลรถตรงกับคำค้นหา</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(v => {
                const isMoving = (v.status || '').includes("MOVING") || (v.speed_kmh || 0) > 3;
                const statusColor = isMoving ? "bg-emerald-500/20 text-emerald-400 border-emerald-500/30" : "bg-amber-500/20 text-amber-400 border-amber-500/30";
                const isSelected = selectedVehicleId === v.vehicle_id;

                return `
                    <div onclick="selectVehicle('${v.vehicle_id}')" 
                         class="p-3 rounded-xl border transition cursor-pointer ${isSelected ? 'bg-sky-950/80 border-sky-500' : 'bg-slate-900 border-slate-700/80 hover:border-slate-600'}">
                        <div class="flex items-center justify-between mb-1.5">
                            <div class="flex items-center space-x-2">
                                <i class="fa-solid fa-car-side text-sky-400"></i>
                                <span class="font-bold text-slate-100 text-sm">${v.vehicle_name || v.vehicle_id}</span>
                                <span class="text-[11px] text-slate-400">(${v.license_plate || '-'})</span>
                            </div>
                            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full border ${statusColor}">
                                ${v.status || (isMoving ? 'MOVING' : 'IDLE')}
                            </span>
                        </div>

                        <div class="grid grid-cols-2 gap-2 mt-2 text-[11px] text-slate-300 bg-slate-800/50 p-2 rounded-lg">
                            <div><i class="fa-solid fa-gauge text-amber-400 mr-1"></i>ความเร็ว: <strong class="text-white">${v.speed_kmh || 0} km/h</strong></div>
                            <div><i class="fa-solid fa-user-gear text-indigo-400 mr-1"></i>คนขับ: <span class="text-slate-200">${v.driver_name || '-'}</span></div>
                            <div><i class="fa-solid fa-gas-pump text-emerald-400 mr-1"></i>น้ำมัน: <span class="text-slate-200">${v.fuel_percent || 0}%</span></div>
                            <div><i class="fa-solid fa-car-battery text-rose-400 mr-1"></i>แบต: <span class="text-slate-200">${v.battery_voltage || 12.6}V</span></div>
                        </div>

                        <div class="flex items-center justify-between mt-2 text-[10px] text-slate-400 pt-1.5 border-t border-slate-800">
                            <span><i class="fa-solid fa-location-dot text-rose-400 mr-1"></i>${(v.latitude || 0).toFixed(4)}, ${(v.longitude || 0).toFixed(4)}</span>
                            <span class="text-sky-400 hover:underline">ดูประวัติเส้นทาง &rarr;</span>
                        </div>
                    </div>
                `;
            }).join('');

            // Update Map Markers
            vehicles.forEach(v => {
                if (!v.latitude || !v.longitude) return;

                const isMoving = (v.status || '').includes("MOVING") || (v.speed_kmh || 0) > 3;
                const markerClass = isMoving ? "vehicle-moving pulse-moving" : "vehicle-idle";

                const iconHtml = `
                    <div class="vehicle-marker ${markerClass} w-9 h-9 text-xs">
                        <i class="fa-solid ${isMoving ? 'fa-location-arrow' : 'fa-parking'}"></i>
                    </div>
                `;

                const customIcon = L.divIcon({
                    html: iconHtml,
                    className: '',
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });

                if (vehicleMarkers[v.vehicle_id]) {
                    vehicleMarkers[v.vehicle_id].setLatLng([v.latitude, v.longitude]);
                    vehicleMarkers[v.vehicle_id].setIcon(customIcon);
                } else {
                    const marker = L.marker([v.latitude, v.longitude], { icon: customIcon }).addTo(map);
                    marker.bindPopup(`
                        <div class="text-slate-900 font-sans p-1">
                            <strong class="text-sm text-sky-600 font-bold">${v.vehicle_name || v.vehicle_id}</strong><br>
                            <span class="text-xs text-slate-600">ทะเบียน: ${v.license_plate || '-'}</span><br>
                            <span class="text-xs font-semibold text-emerald-600">ความเร็ว: ${v.speed_kmh || 0} km/h</span><br>
                            <span class="text-[11px] text-slate-500">คนขับ: ${v.driver_name || '-'}</span>
                        </div>
                    `);
                    vehicleMarkers[v.vehicle_id] = marker;
                }
            });
        }

        async function selectVehicle(vehicleId) {
            selectedVehicleId = vehicleId;
            const vehicle = vehiclesData.find(v => v.vehicle_id === vehicleId);

            if (vehicle && vehicle.latitude && vehicle.longitude) {
                map.flyTo([vehicle.latitude, vehicle.longitude], 14, { duration: 1.2 });
                if (vehicleMarkers[vehicleId]) {
                    vehicleMarkers[vehicleId].openPopup();
                }
            }

            fetchVehicleHistory(vehicleId);
            updateUI(vehiclesData);
        }

        async function fetchVehicleHistory(vehicleId) {
            try {
                const cleanedUrl = supabaseUrl.trim().replace(/\/$/, "");
                const res = await fetch(`${cleanedUrl}/rest/v1/telemetry_history?vehicle_id=eq.${vehicleId}&order=created_at.asc&limit=100`, {
                    headers: {
                        'apikey': supabaseKey,
                        'Authorization': `Bearer ${supabaseKey}`
                    }
                });

                if (!res.ok) return;
                const history = await res.json();

                if (historyPolyline) map.removeLayer(historyPolyline);

                if (history.length > 1) {
                    const latLngs = history.map(h => [h.latitude, h.longitude]);
                    historyPolyline = L.polyline(latLngs, {
                        color: '#38BDF8',
                        weight: 4,
                        opacity: 0.8,
                        dashArray: '8, 8'
                    }).addTo(map);
                }
            } catch (err) {
                console.error("History fetch error:", err);
            }
        }

        function filterVehicles() {
            updateUI(vehiclesData);
        }

        function toggleSettingsModal() {
            document.getElementById("settingsModal").classList.toggle("hidden");
        }

        function saveSettings() {
            supabaseUrl = document.getElementById("supabaseUrlInput").value;
            supabaseKey = document.getElementById("supabaseKeyInput").value;
            localStorage.setItem("sp_url", supabaseUrl);
            localStorage.setItem("sp_key", supabaseKey);
            toggleSettingsModal();
            fetchVehiclesData();
        }

        // Initial Load & Auto Poll every 3 seconds
        fetchVehiclesData();
        setInterval(fetchVehiclesData, 3000);
    </script>
</body>
</html>
